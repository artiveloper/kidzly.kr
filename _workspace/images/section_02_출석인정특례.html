<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo',
                 'Malgun Gothic', '맑은 고딕', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #0F172A;
    padding: 72px 80px;
  }

  .row { margin-bottom: 22px; }
  .row-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .row-label { font-size: 29px; font-weight: 700; color: #F1F5F9; letter-spacing: -0.5px; }
  .row-day { font-size: 30px; font-weight: 800; color: #60A5FA; letter-spacing: -0.5px; }
  .track { width: 920px; height: 22px; background: #1E293B; border-radius: 11px; overflow: hidden; }
  .fill { height: 100%; border-radius: 11px; background: linear-gradient(90deg, #3B82F6, #60A5FA); }
</style>
</head>
<body>
  <div class="canvas">
    <div style="font-size: 25px; font-weight: 700; color: #60A5FA; letter-spacing: -0.3px; margin-bottom: 12px;">
      결석해도 출석으로 인정되는 사유
    </div>
    <div style="font-size: 46px; font-weight: 800; color: #F8FAFC; letter-spacing: -1.3px; line-height: 1.28; margin-bottom: 40px;">
      사유마다 인정 상한일수가<br>다릅니다
    </div>

    <div class="row">
      <div class="row-head"><span class="row-label">아동 질병·부상</span><span class="row-day">최대 90일</span></div>
      <div class="track"><div class="fill" style="width:920px;"></div></div>
    </div>
    <div class="row">
      <div class="row-head"><span class="row-label">부모의 출산</span><span class="row-day">최대 90일</span></div>
      <div class="track"><div class="fill" style="width:920px;"></div></div>
    </div>
    <div class="row">
      <div class="row-head"><span class="row-label">부모의 입원</span><span class="row-day">최대 60일</span></div>
      <div class="track"><div class="fill" style="width:613px;"></div></div>
    </div>
    <div class="row">
      <div class="row-head"><span class="row-label">현장체험학습·가정학습 등</span><span class="row-day">연 누적 30일</span></div>
      <div class="track"><div class="fill" style="width:307px;"></div></div>
    </div>
    <div class="row">
      <div class="row-head"><span class="row-label">입양</span><span class="row-day">20일</span></div>
      <div class="track"><div class="fill" style="width:204px;"></div></div>
    </div>
    <div class="row" style="margin-bottom: 0;">
      <div class="row-head"><span class="row-label">부모·조부모·외조부모 사망</span><span class="row-day">5일</span></div>
      <div class="track"><div class="fill" style="width:51px;"></div></div>
    </div>

    <div style="position: absolute; left: 80px; right: 80px; bottom: 96px;
                border-top: 1px solid #1E293B; padding-top: 26px;
                font-size: 22px; font-weight: 500; color: #64748B; letter-spacing: -0.3px; line-height: 1.5;">
      이 외에도 감염병 모니터링, 발열·호흡기 증상, 형제자매 사망(3일), 형제자매·부모의 결혼(1일),<br>
      미세먼지 고농도 등 인정 사유가 더 있습니다
    </div>

    <div style="position: absolute; bottom: 32px; right: 80px;
                font-size: 22px; font-weight: 700; color: #475569; letter-spacing: -0.3px;">
      kidzly
    </div>
  </div>
</body>
</html>
