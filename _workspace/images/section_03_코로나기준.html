<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo',
                 'Malgun Gothic', '맑은 고딕', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #FFFFFF;
  }

  .box {
    flex: 1;
    border-radius: 24px;
    padding: 56px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }
</style>
</head>
<body>
  <div class="canvas" style="padding: 64px 72px;">

    <div style="font-size: 23px; font-weight: 700; color: #E11D48; letter-spacing: -0.3px; margin-bottom: 12px;">
      코로나19 기준, 바뀌었습니다
    </div>
    <h2 style="font-size: 42px; font-weight: 800; color: #1E293B; letter-spacing: -1.2px; line-height: 1.3; margin-bottom: 60px;">
      "확진 후 5일"은<br>2024년에 폐지됐습니다
    </h2>

    <div style="display: flex; align-items: center; gap: 20px;">
      <div class="box" style="background: #F1F5F9;">
        <div style="font-size: 21px; font-weight: 700; color: #94A3B8; letter-spacing: -0.3px;">
          이전 기준 (~2024.4)
        </div>
        <div style="font-size: 50px; font-weight: 800; color: #94A3B8; letter-spacing: -1px; line-height: 1.25;
                    text-decoration: line-through; text-decoration-color: #CBD5E1; text-decoration-thickness: 4px;">
          확진 후<br>5일간 격리
        </div>
        <div style="font-size: 20px; font-weight: 700; color: #FFFFFF; background: #94A3B8;
                    border-radius: 100px; padding: 10px 22px; letter-spacing: -0.2px;">
          폐지됨
        </div>
      </div>

      <div style="font-size: 48px; color: #CBD5E1; flex: 0 0 auto;">→</div>

      <div class="box" style="background: linear-gradient(160deg, #FFF1F2 0%, #FFE4E6 100%); border: 2px solid #FECDD3;">
        <div style="font-size: 21px; font-weight: 700; color: #E11D48; letter-spacing: -0.3px;">
          현재 기준 (2024.5.1~)
        </div>
        <div style="font-size: 38px; font-weight: 800; color: #1E293B; letter-spacing: -0.8px; line-height: 1.35;">
          주요 증상 호전 후<br>24시간 경과 시까지
        </div>
        <div style="font-size: 20px; font-weight: 700; color: #FFFFFF; background: #E11D48;
                    border-radius: 100px; padding: 10px 22px; letter-spacing: -0.2px;">
          권고 · 의무 아님
        </div>
      </div>
    </div>

    <div style="margin-top: 56px; background: #F8FAFC; border-radius: 16px; padding: 44px 40px;">
      <div style="font-size: 23px; color: #475569; letter-spacing: -0.3px; line-height: 1.75;">
        국가 기준은 <span style="color:#1E293B; font-weight:700;">권고</span>지만, 어린이집은 영유아보육법 제32조에 따라
        <span style="color:#1E293B; font-weight:700;">원 자체 판단으로 더 엄격하게</span> 등원을 제한할 수 있습니다.
      </div>
    </div>

    <div style="position: absolute; bottom: 56px; left: 72px; right: 72px;
                display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 19px; color: #94A3B8; letter-spacing: -0.2px;">
        질병관리청 보도자료(2024.4.19 배포, 2024.5.1 시행) 기준
      </div>
      <div style="font-size: 24px; font-weight: 700; color: #CBD5E1; letter-spacing: -0.3px;">
        kidzly
      </div>
    </div>

  </div>
</body>
</html>
