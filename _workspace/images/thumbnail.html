<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(145deg, #EEF6FF 0%, #DCEEFF 60%, #C8E2FF 100%);
  }
  .canvas { width: 1080px; height: 1080px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }

  .brand {
    position: absolute; top: 56px; left: 64px;
    font-size: 30px; font-weight: 800; color: #2563EB; letter-spacing: -0.5px;
  }
  .badge {
    display: inline-block; background: #2563EB; color: #fff;
    font-size: 26px; font-weight: 700; padding: 12px 32px;
    border-radius: 100px; margin-bottom: 44px; letter-spacing: 0.3px;
  }
  h1 {
    font-size: 80px; font-weight: 900; color: #0F172A;
    line-height: 1.2; letter-spacing: -3px; text-align: center; margin-bottom: 36px;
  }
  h1 em { color: #2563EB; font-style: normal; }
  .sub {
    font-size: 32px; font-weight: 400; color: #475569;
    letter-spacing: -0.5px; text-align: center; line-height: 1.6;
  }
  .chips {
    display: flex; gap: 16px; margin-top: 52px; flex-wrap: wrap; justify-content: center;
  }
  .chip {
    background: #fff; border: 2px solid #BFDBFE;
    color: #1D4ED8; font-size: 24px; font-weight: 600;
    padding: 10px 24px; border-radius: 100px; letter-spacing: -0.3px;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 8px; background: linear-gradient(90deg, #2563EB, #60A5FA, #93C5FD);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="brand">kidzly</div>
  <span class="badge">영유아 지원금 가이드</span>
  <h1>부모급여<br><em>완벽 총정리</em></h1>
  <p class="sub">금액 · 신청방법 · 어린이집 차액까지<br>꼭 알아야 할 모든 것</p>
  <div class="chips">
    <span class="chip">만 0세 월 100만원</span>
    <span class="chip">만 1세 월 50만원</span>
    <span class="chip">60일 이내 신청</span>
  </div>
  <div class="bottom-bar"></div>
</div>
</body>
</html>
