<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo',
                 'Malgun Gothic', '맑은 고딕', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #F1F5F9;
  }
</style>
</head>
<body>
  <div class="canvas" style="display: flex; align-items: center; justify-content: center;">
    <div style="width: 820px; height: 820px; border-radius: 220px;
                background: linear-gradient(145deg, #F43F5E 0%, #BE123C 100%);
                box-shadow: 0 40px 80px -20px #BE123C66;
                display: flex; align-items: center; justify-content: center;">
      <div style="font-size: 420px; line-height: 1;">🌡️</div>
    </div>
  </div>
</body>
</html>
