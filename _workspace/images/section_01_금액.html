<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #FFFFFF;
  }
  .canvas { width: 1080px; height: 1080px; padding: 80px; display: flex; flex-direction: column; }

  .title-area { margin-bottom: 60px; }
  .label { font-size: 24px; font-weight: 700; color: #2563EB; letter-spacing: 0.5px; margin-bottom: 16px; }
  h2 { font-size: 56px; font-weight: 900; color: #0F172A; letter-spacing: -2px; line-height: 1.2; }

  .cards { display: flex; flex-direction: column; gap: 28px; flex: 1; }
  .card {
    flex: 1; border-radius: 24px; padding: 40px 48px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-0 { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); border: 2px solid #BFDBFE; }
  .card-1 { background: linear-gradient(135deg, #F0FDF4, #DCFCE7); border: 2px solid #BBF7D0; }
  .card-label { font-size: 32px; font-weight: 700; color: #1E293B; letter-spacing: -0.5px; }
  .card-sub { font-size: 22px; font-weight: 400; color: #64748B; margin-top: 8px; }
  .card-amount { text-align: right; }
  .amount { font-size: 64px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
  .card-0 .amount { color: #1D4ED8; }
  .card-1 .amount { color: #15803D; }
  .amount-label { font-size: 22px; font-weight: 500; color: #64748B; margin-top: 8px; }

  .note {
    margin-top: 32px; padding: 24px 32px;
    background: #F8FAFC; border-radius: 16px;
    font-size: 22px; color: #64748B; line-height: 1.6;
  }
  .note strong { color: #1E293B; }
  .brand { position: absolute; bottom: 56px; right: 80px; font-size: 24px; font-weight: 700; color: #CBD5E1; }
</style>
</head>
<body>
<div class="canvas" style="position:relative;">
  <div class="title-area">
    <div class="label">부모급여 지급 금액</div>
    <h2>가정양육 시<br>월 지급액</h2>
  </div>
  <div class="cards">
    <div class="card card-0">
      <div>
        <div class="card-label">만 0세</div>
        <div class="card-sub">생후 0~11개월</div>
      </div>
      <div class="card-amount">
        <div class="amount">100만원</div>
        <div class="amount-label">매월 25일 지급</div>
      </div>
    </div>
    <div class="card card-1">
      <div>
        <div class="card-label">만 1세</div>
        <div class="card-sub">생후 12~23개월</div>
      </div>
      <div class="card-amount">
        <div class="amount">50만원</div>
        <div class="amount-label">매월 25일 지급</div>
      </div>
    </div>
  </div>
  <div class="note">
    <strong>💡 아동수당 중복 수령 가능</strong> — 만 0세 기준 부모급여 100만원 + 아동수당 10만원 = 월 최대 <strong>110만원</strong><br>
    출처: 복지로(bokjiro.go.kr), 보건복지부(mohw.go.kr)
  </div>
  <div class="brand">kidzly</div>
</div>
</body>
</html>
