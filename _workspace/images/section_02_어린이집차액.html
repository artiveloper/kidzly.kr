<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #0F172A;
  }
  .canvas { width: 1080px; height: 1080px; padding: 72px 80px; display: flex; flex-direction: column; }

  .label { font-size: 24px; font-weight: 700; color: #60A5FA; letter-spacing: 0.5px; margin-bottom: 20px; }
  h2 { font-size: 56px; font-weight: 900; color: #F1F5F9; letter-spacing: -2px; line-height: 1.2; margin-bottom: 48px; }

  .row-header {
    display: grid; grid-template-columns: 160px 1fr 1fr 1fr;
    gap: 0; margin-bottom: 4px;
  }
  .row-header div { font-size: 22px; font-weight: 600; color: #64748B; padding: 16px 20px; text-align: center; }
  .row-header div:first-child { text-align: left; }

  .row {
    display: grid; grid-template-columns: 160px 1fr 1fr 1fr;
    gap: 0; border-radius: 16px; margin-bottom: 16px; overflow: hidden;
  }
  .cell {
    padding: 40px 20px; text-align: center;
    font-size: 28px; font-weight: 700; color: #F1F5F9;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .cell-label { background: #1E293B; text-align: left; align-items: flex-start; }
  .cell-age { font-size: 32px; font-weight: 800; color: #F1F5F9; }
  .cell-sub { font-size: 20px; font-weight: 400; color: #94A3B8; margin-top: 6px; }

  .row-0 .cell-a { background: #1E3A5F; }
  .row-0 .cell-b { background: #1E3A5F; }
  .row-0 .cell-c { background: #1E4620; }

  .row-1 .cell-a { background: #1E293B; }
  .row-1 .cell-b { background: #1E293B; }
  .row-1 .cell-c { background: #2D1B1B; }

  .highlight { color: #4ADE80; font-size: 36px; }
  .muted { color: #94A3B8; font-size: 24px; }

  .note-box {
    margin-top: 32px; padding: 36px 40px;
    background: #1E293B; border-radius: 20px; border-left: 5px solid #60A5FA;
    flex: 1; display: flex; align-items: center;
  }
  .note-box p { font-size: 22px; color: #94A3B8; line-height: 1.8; word-break: keep-all; }
  .note-box strong { color: #F1F5F9; }

  .brand { position: absolute; bottom: 56px; right: 80px; font-size: 24px; font-weight: 700; color: #334155; }
</style>
</head>
<body>
<div class="canvas" style="position:relative;">
  <div class="label">어린이집 이용 시 부모급여</div>
  <h2>바우처 + 차액으로<br>나눠서 받습니다</h2>

  <div class="row-header">
    <div>연령</div>
    <div>부모급여</div>
    <div>보육료 (바우처)</div>
    <div>현금 차액</div>
  </div>

  <div class="row row-0">
    <div class="cell cell-label">
      <div class="cell-age">만 0세</div>
      <div class="cell-sub">0~11개월</div>
    </div>
    <div class="cell cell-a">1,000,000원</div>
    <div class="cell cell-b">584,000원</div>
    <div class="cell cell-c"><span class="highlight">416,000원</span><br><span class="muted" style="font-size:18px;">익월 20일</span></div>
  </div>

  <div class="row row-1">
    <div class="cell cell-label">
      <div class="cell-age">만 1세</div>
      <div class="cell-sub">12~23개월</div>
    </div>
    <div class="cell cell-a">500,000원</div>
    <div class="cell cell-b">515,000원</div>
    <div class="cell cell-c"><span class="muted">없음</span></div>
  </div>

  <div class="note-box">
    <p>
      <strong>만 1세</strong>는 기본보육료 515,000원이 부모급여 500,000원보다 높아<br>현금 차액이 발생하지 않습니다.<br>
      <span style="font-size:19px;">출처: 복지로(bokjiro.go.kr) / 보건복지부(mohw.go.kr)</span>
    </p>
  </div>
  <div class="brand">kidzly</div>
</div>
</body>
</html>
